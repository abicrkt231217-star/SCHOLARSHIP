<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Bacchon 🚀 - ABIC Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0a0a0f; }
        .glass { background: rgba(19, 19, 26, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="text-gray-100 min-h-screen">

    <!-- Header & Poster Slider -->
    <div class="max-w-4xl mx-auto px-4 py-6">
        <h1 class="text-center text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-neoncyan to-neongreen mb-6">Hello Bacchon 🚀</h1>
        
        <!-- Poster Slider Section -->
        <div id="poster-slider" class="w-full h-48 sm:h-64 rounded-2xl overflow-hidden mb-8 shadow-2xl border border-gray-800">
            <img src="https://via.placeholder.com/800x400?text=Upload+Poster+in+Sheet" class="w-full h-full object-cover">
        </div>

        <!-- Navigation Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
            <button onclick="scrollToPanel('attendance')" class="glass p-4 rounded-xl hover:border-cyan-500 transition">Check Attendance</button>
            <button onclick="scrollToPanel('status')" class="glass p-4 rounded-xl hover:border-purple-500 transition">Check Status</button>
            <button onclick="scrollToPanel('know-pen')" class="glass p-4 rounded-xl hover:border-yellow-500 transition">Know PEN No.</button>
            <button onclick="scrollToPanel('know-reg')" class="glass p-4 rounded-xl hover:border-pink-500 transition">Know Board Reg.</button>
            <button onclick="scrollToPanel('suggestion')" class="glass p-4 rounded-xl hover:border-green-500 transition">Suggestion</button>
            <button onclick="scrollToPanel('contact')" class="glass p-4 rounded-xl hover:border-blue-500 transition">Contact</button>
        </div>

        <!-- Panels (Added smooth scroll targets) -->
        <div id="attendance" class="glass p-6 rounded-2xl mb-6">... (Existing Attendance Code) ...</div>
        <div id="status" class="glass p-6 rounded-2xl mb-6">... (Existing Status Code) ...</div>
        
        <!-- Know Your Details Panels -->
        <div id="know-pen" class="glass p-6 rounded-2xl mb-6">
            <h3 class="text-xl font-bold mb-4">Know Your PEN No.</h3>
            <input type="text" id="pen-search" onkeyup="searchStudent('PEN_No')" placeholder="Search by SR No, Name or Father Name..." class="w-full bg-black/40 p-3 rounded-xl border border-gray-700">
            <div id="pen-result" class="mt-4 p-4 bg-black/50 rounded-xl"></div>
        </div>

        <!-- Footer with Counter -->
        <footer class="text-center text-gray-500 py-8">
            <p>Total Visits: <span id="visit-count" class="font-bold text-white">1,240</span></p>
            <p class="text-xs mt-2">Designed for Aditya Birla Intermediate College</p>
        </footer>
    </div>

    <script>
        // Auto Scroll Logic
        function scrollToPanel(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // Global Search Logic for PEN/Board Reg
        async function searchStudent(type) {
            let query = document.getElementById(type === 'PEN_No' ? 'pen-search' : 'reg-search').value.toLowerCase();
            if(query.length < 3) return;

            let response = await fetch("https://sheetdb.io/api/v1/a137v3i0ffmy9?sheet=StudentDatabase");
            let data = await response.json();
            
            let result = data.find(s => 
                s.SR_No.toLowerCase().includes(query) || 
                s.Student_Name.toLowerCase().includes(query) || 
                s.Father_Name.toLowerCase().includes(query)
            );

            let resDiv = document.getElementById(type === 'PEN_No' ? 'pen-result' : 'reg-result');
            if(result) {
                resDiv.innerHTML = `<p><strong>${result.Student_Name}</strong> (F: ${result.Father_Name})<br> Result: ${type === 'PEN_No' ? result.PEN_No : result.Board_Reg_No}</p>`;
            } else {
                resDiv.innerHTML = "No record found.";
            }
        }

        // Load Posters dynamically from Sheet
        async function loadPosters() {
            let res = await fetch("https://sheetdb.io/api/v1/a137v3i0ffmy9?sheet=Posters");
            let data = await res.json();
            if(data.length > 0) {
                document.getElementById('poster-slider').innerHTML = `<img src="${data[0].Image_URL}" class="w-full h-full object-cover">`;
            }
        }

        window.onload = () => { loadDashboardStats(); loadPosters(); };
    </script>
</body>
</html>
