<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G Cloud</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            padding: 30px;
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid #222;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin-bottom: 8px;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
        }

        .error {
            color: #f87171;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="loader" id="loader"></div>

    <h2>☁️ G Cloud</h2>

    <p id="status">
        Connecting to G Cloud...
    </p>

</div>

<script>

async function openGCloud() {

    const status =
        document.getElementById("status");

    try {

        const response =
            await fetch(
                "./gcloud-url.json?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Unable to get current G Cloud URL."
            );
        }

        const data =
            await response.json();

        if (
            !data.url ||
            !data.url.startsWith(
                "https://"
            )
        ) {
            throw new Error(
                "G Cloud is currently unavailable."
            );
        }

        status.textContent =
            "Opening G Cloud...";

        window.location.replace(
            data.url
        );

    } catch (error) {

        console.error(error);

        document
            .getElementById("loader")
            .style.display = "none";

        status.className = "error";

        status.innerHTML =
            "G Cloud is temporarily unavailable.<br>" +
            "Please try again in a moment.";
    }
}

openGCloud();

</script>

</body>
</html>
